<!DOCTYPE html>
<html>
<head>
  <title>Student Management System</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; }
    input, button { padding: 6px; margin: 4px 0; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <h2>Student Management System</h2>
  <input id="name" placeholder="Name">
  <input id="course" placeholder="Course">
  <button onclick="addStudent()">Add</button>
  <ul id="list"></ul>

  <script>
    async function load() {
      const res = await fetch("/students");
      const data = await res.json();
      document.getElementById("list").innerHTML = data.map(s =>
        `<li>${s.name} (${s.course})
          <button onclick="editStudent(${s.id})">Edit</button>
          <button onclick="removeStudent(${s.id})">Delete</button></li>`
      ).join("");
    }
    async function addStudent() {
      const name = document.getElementById("name").value;
      const course = document.getElementById("course").value;
      await fetch("/students", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name, course})});
      load();
    }
    async function editStudent(id) {
      const name = prompt("New name:");
      if (!name) return;
      await fetch("/students/" + id, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name})});
      load();
    }
    async function removeStudent(id) {
      await fetch("/students/" + id, {method: "DELETE"});
      load();
    }
    load();
  </script>
</body>
</html>
